name: Gallery schedule

# Keeps the bundled module gallery's pinned refs current. Proposes the bump as a
# pull request rather than committing it, so a moved pin is always reviewed —
# and validated — before it reaches a release.

on:
  schedule:
    # Fortnightly, 06:17 UTC on the 1st and 15th. Cron cannot express a 14-day
    # period, so two days-of-month is the idiom; the gap is 14 days mid-month
    # and 15–17 days across a month boundary. A cron also cannot key off an
    # Ubuntu release date, so this runs every cycle and opens a PR only when a
    # pin actually moved. Use `workflow_dispatch` to run it on demand, e.g.
    # right after a release.
    - cron: '17 6 1,15 * *'
  workflow_dispatch:
    inputs:
      track:
        description: 'Ref to track in each module (HEAD, a branch, or a tag)'
        required: false
        default: HEAD

permissions:
  contents: write
  pull-requests: write

# One refresh at a time; never cancel a run mid-bump.
concurrency:
  group: gallery-schedule
  cancel-in-progress: false

jobs:
  bump:
    name: Bump gallery refs
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Install just
        run: sudo snap install just --classic

      # Resolves each entry's module with `git ls-remote`. A module that cannot
      # be reached exits non-zero and fails the job, so a flaky remote never
      # produces a half-bumped manifest.
      - name: Resolve each module's current ref
        id: bump
        env:
          TRACK: ${{ inputs.track }}
        run: |
          args=(-dry-run)
          if [ -n "$TRACK" ]; then
            args+=(-ref "$TRACK")
          fi
          go run ./tools/gallerybump "${args[@]}" | tee /tmp/bump.txt
          if grep -q '^no bumps' /tmp/bump.txt; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # The point of the gate: prove the new pins still scaffold and validate
      # before proposing them. A failed run leaves main on the last known-good
      # pins and opens no PR.
      - name: Validate the bumped gallery
        if: steps.bump.outputs.changed == 'true'
        run: |
          just gallery-lint
          just gallery-check

      - name: Open or refresh the bump PR
        if: steps.bump.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: automation/gallery-bump
          # The bump PR is reviewed, never auto-merged: a moved pin changes what
          # a published quick start deploys.
          REVIEWERS: MichaelThamm
          # The PR body, in the format the pr-description skill produces: the
          # template's headings, one full-width line per paragraph, absolute
          # links. The block scalar strips the YAML indentation, so GitHub
          # renders prose instead of a leading-space code block.
          BODY: |
            ## Summary

            Bumps every bundled gallery entry's pinned `ref` to the revision its module currently tracks, so a quick start published from this repository does not deploy a stale module. Only the `ref` lines change — module addresses, subdirectories, presets, and `requires` are untouched.

            ## Decision and spec

            - **ADR:** [ADR-0040](https://github.com/MichaelThamm/atelier/blob/main/docs/adr/0040-automated-gallery-refresh.md) — the scheduled refresh this pull request implements.
            - **SPEC:** none.

            ## Scope check

            - [x] Fits Atelier's boundaries in [SPEC.md](https://github.com/MichaelThamm/atelier/blob/main/docs/SPEC.md).

            ## Tests

            `just gallery-lint` and `just gallery-check` run in the bump job before this pull request opens, and the `Module gallery` CI job re-validates every bumped pin. The rest of `just check` runs on this pull request.

            ## Docs

            None — the website is regenerated from the manifest after merge.

            ## Risk and rollback

            A moved pin changes what a documented one-liner deploys; close this pull request to keep the previous pins, or revert the single bump commit after merge. A module that renamed a variable, changed a default, or added a required input fails `just gallery-lint` and must be fixed here.

            ## Reviewer notes

            Review the diff for anything beyond the `ref` lines. The bump deliberately does not touch presets or `requires`; see ADR-0040 and the `gallery-bump` skill.
        run: |
          git config user.name "atelier-bot"
          git config user.email "atelier-bot@users.noreply.github.com"
          git checkout -B "$BRANCH"
          go run ./tools/gallerybump
          git add internal/gallery/gallery.json
          git commit -m "chore(gallery): bump module refs to the current tracked ref"
          git push --force origin "$BRANCH"
          pr="$(gh pr list --head "$BRANCH" --state open --json number -q '.[0].number')"
          if [ -n "$pr" ]; then
            # Force-pushing the branch does not re-request review, so ask again
            # for the refreshed pins; refresh the body too, so it tracks the
            # workflow rather than the first run.
            gh pr edit "$pr" --body "$BODY" --add-reviewer "$REVIEWERS"
            gh pr comment "$pr" --body "Refreshed against main at $(date -u +%FT%TZ)."
          else
            gh pr create --base main --head "$BRANCH" \
              --title "chore(gallery): bump module refs to the current tracked ref" \
              --reviewer "$REVIEWERS" \
              --body "$BODY"
          fi