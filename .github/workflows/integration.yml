name: Integration
run-name: Atelier integration (${{ inputs.juju-channel || '3.6/stable' }})

on:
  workflow_dispatch:
    inputs:
      juju-channel:
        description: 'The Juju snap channel to prepare the controller with.'
        type: string
        default: 3.6/stable
  pull_request:
    paths:
      - "cmd/**"
      - "internal/**"
      - "tests/integration/**"
      - "docs/examples/**"
      - "go.mod"
      - "go.sum"
      - "concierge-k8s.yaml"
      - ".github/workflows/integration.yml"
  # Enable to run on merges to main as well:
  # push:
  #   branches: [main]
  #   paths:
  #     - "cmd/**"
  #     - "internal/**"
  #     - "tests/integration/**"
  #     - "docs/examples/**"
  #     - "go.mod"
  #     - "go.sum"
  #     - "concierge-k8s.yaml"
  #     - ".github/workflows/integration.yml"

permissions:
  contents: read

concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration:
    name: Deploy loki-operators with Atelier + Terraform
    # Swap for a Canonical self-hosted runner if available, e.g.
    # self-hosted-linux-amd64-noble-large.
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Concierge prepare (Juju + Canonical K8s)
        timeout-minutes: 30
        run: |
          sudo snap install concierge --classic
          sudo concierge prepare \
            --config concierge-k8s.yaml \
            --juju-channel ${{ inputs.juju-channel || '3.6/stable' }} \
            --extra-snaps astral-uv,terraform

      - name: Build Atelier
        run: |
          go build -o "$RUNNER_TEMP/atelier" ./cmd/atelier
          echo "ATELIER_BIN=$RUNNER_TEMP/atelier" >> "$GITHUB_ENV"

      - name: Test deployment
        run: |
          if [[ "${{ runner.debug }}" == "1" ]]; then
            export KEEP_MODELS=true
          fi
          uv run --project tests/integration --frozen pytest tests/integration/loki \
            -m cloud -vv -ra --capture=no --exitfirst

      - name: Open SSH session on failure
        if: ${{ failure() && (runner.debug == '1') }}
        uses: mxschmitt/action-tmate@v3
        with:
          timeout-minutes: 30
          limit-access-to-actor: true
