name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      juju-channel:
        description: 'Juju snap channel the integration-test controller is prepared with.'
        type: string
        default: 3.6/stable

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: build · vet · test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Verify formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "${unformatted}" ]; then
            echo "These files are not gofmt-formatted:"
            echo "${unformatted}"
            exit 1
          fi

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...

  # Feature tests for `atelier module add` against a real module.
  wrapper:
    name: Wrapper feature tests
    needs: build-test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Install uv
        run: |
          sudo snap install astral-uv --classic
          echo "/snap/bin" >> "$GITHUB_PATH"

      - name: Build Atelier
        run: |
          go build -o "$RUNNER_TEMP/atelier" ./cmd/atelier
          echo "ATELIER_BIN=$RUNNER_TEMP/atelier" >> "$GITHUB_ENV"

      - name: Test wrapper features
        run: |
          uv run --project tests/integration --frozen pytest tests/integration/wrapper \
            -vv -ra --capture=no --exitfirst

  # The deployment smoke test: needs a Juju controller on Kubernetes, prepared by Concierge.
  prometheus:
    name: Deploy prometheus-k8s with Atelier + Terraform
    needs: build-test
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Allow forwarded traffic
        run: |
          sudo iptables -P FORWARD ACCEPT
          sudo ip6tables -P FORWARD ACCEPT || true

      - name: Concierge prepare (Juju + Canonical K8s)
        timeout-minutes: 30
        run: |
          sudo snap install concierge --classic
          sudo concierge prepare \
            --config concierge-k8s.yaml \
            --juju-channel ${{ github.event.inputs['juju-channel'] || '3.6/stable' }} \
            --extra-snaps astral-uv,terraform

      - name: Build Atelier
        run: |
          go build -o "$RUNNER_TEMP/atelier" ./cmd/atelier
          echo "ATELIER_BIN=$RUNNER_TEMP/atelier" >> "$GITHUB_ENV"

      - name: Test deployment
        run: |
          if [[ "${{ runner.debug }}" == "1" ]]; then
            export KEEP_MODELS=true
          fi
          uv run --project tests/integration --frozen pytest tests/integration/prometheus \
            -m cloud -vv -ra --capture=no --exitfirst

      - name: Open SSH session on failure
        if: ${{ failure() && (runner.debug == '1') }}
        uses: mxschmitt/action-tmate@v3
        with:
          timeout-minutes: 30
          limit-access-to-actor: true

  # The import round-trip: module add, deploy, drop state, re-import.
  import:
    name: Recover COS-Lite state with Atelier import
    needs: build-test
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Allow forwarded traffic
        run: |
          sudo iptables -P FORWARD ACCEPT
          sudo ip6tables -P FORWARD ACCEPT || true

      - name: Concierge prepare (Juju + Canonical K8s)
        timeout-minutes: 30
        run: |
          sudo snap install concierge --classic
          sudo concierge prepare \
            --config concierge-k8s.yaml \
            --juju-channel ${{ github.event.inputs['juju-channel'] || '3.6/stable' }} \
            --extra-snaps astral-uv,terraform

      - name: Build Atelier
        run: |
          go build -o "$RUNNER_TEMP/atelier" ./cmd/atelier
          echo "ATELIER_BIN=$RUNNER_TEMP/atelier" >> "$GITHUB_ENV"

      - name: Test import round-trip
        run: |
          if [[ "${{ runner.debug }}" == "1" ]]; then
            export KEEP_MODELS=true
          fi
          uv run --project tests/integration --frozen pytest tests/integration/import \
            -m cloud -vv -ra --capture=no --exitfirst

      - name: Open SSH session on failure
        if: ${{ failure() && (runner.debug == '1') }}
        uses: mxschmitt/action-tmate@v3
        with:
          timeout-minutes: 30
          limit-access-to-actor: true
