name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      juju-channel:
        description: 'Juju snap channel the integration-test controller is prepared with.'
        type: string
        default: 3.6/stable

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: build · vet · test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Install just
        run: sudo snap install just --classic

      - name: Run the local gate
        run: just check

  # Decide whether the integration tiers need to run. They build and exercise
  # the real binary against Terraform and (for the cloud tiers) a Juju
  # controller, so a documentation-only change cannot affect them. Non-PR runs
  # (pushes to main, manual dispatch) always run them.
  changes:
    name: detect integration-relevant changes
    runs-on: ubuntu-latest
    outputs:
      integration: ${{ steps.filter.outputs.integration }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Filter changed paths
        id: filter
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [[ "$EVENT" != "pull_request" ]]; then
            echo "integration=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed="$(git diff --name-only "$BASE_SHA"...HEAD)"
          if [[ -z "$changed" ]] || ! grep -qvE '^(docs/|LICENSE$|.*\.(md|gif|png|svg|jpe?g)$)' <<<"$changed"; then
            echo "integration=false" >> "$GITHUB_OUTPUT"
          else
            echo "integration=true" >> "$GITHUB_OUTPUT"
          fi

  # Fast integration tier: `atelier module add` against a real module. No Juju model.
  wrapper:
    name: Fast integration tests
    needs: [build-test, changes]
    if: needs.changes.outputs.integration == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Install tools
        run: |
          sudo snap install astral-uv --classic
          sudo snap install just --classic
          echo "/snap/bin" >> "$GITHUB_PATH"

      - name: Test integration (fast tier)
        run: just test-integration

  # The deployment smoke test: needs a Juju controller on Kubernetes, prepared by Concierge.
  prometheus:
    name: Deploy prometheus-k8s with Atelier + Terraform
    needs: [build-test, changes]
    if: needs.changes.outputs.integration == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Allow forwarded traffic
        run: |
          sudo iptables -P FORWARD ACCEPT
          sudo ip6tables -P FORWARD ACCEPT || true

      - name: Concierge prepare (Juju + Canonical K8s)
        timeout-minutes: 30
        run: |
          sudo snap install concierge --classic
          sudo concierge prepare \
            --config concierge-k8s.yaml \
            --juju-channel ${{ github.event.inputs['juju-channel'] || '3.6/stable' }} \
            --extra-snaps astral-uv,terraform

      - name: Install just
        run: sudo snap install just --classic

      - name: Test deployment
        run: |
          if [[ "${{ runner.debug }}" == "1" ]]; then
            export KEEP_MODELS=true
          fi
          just test-prometheus

      - name: Open SSH session on failure
        if: ${{ failure() && (runner.debug == '1') }}
        uses: mxschmitt/action-tmate@v3
        with:
          timeout-minutes: 30
          limit-access-to-actor: true

  # The import round-trip: module add, deploy, drop state, re-import.
  import:
    name: Recover COS-Lite state with Atelier import
    needs: [build-test, changes]
    if: needs.changes.outputs.integration == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Allow forwarded traffic
        run: |
          sudo iptables -P FORWARD ACCEPT
          sudo ip6tables -P FORWARD ACCEPT || true

      - name: Concierge prepare (Juju + Canonical K8s)
        timeout-minutes: 30
        run: |
          sudo snap install concierge --classic
          sudo concierge prepare \
            --config concierge-k8s.yaml \
            --juju-channel ${{ github.event.inputs['juju-channel'] || '3.6/stable' }} \
            --extra-snaps astral-uv,terraform

      - name: Install just
        run: sudo snap install just --classic

      - name: Test import round-trip
        run: |
          if [[ "${{ runner.debug }}" == "1" ]]; then
            export KEEP_MODELS=true
          fi
          just test-import

      - name: Open SSH session on failure
        if: ${{ failure() && (runner.debug == '1') }}
        uses: mxschmitt/action-tmate@v3
        with:
          timeout-minutes: 30
          limit-access-to-actor: true
