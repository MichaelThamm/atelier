name: Pages

on:
  push:
    branches: [main]
    paths:
      - website/**
      - internal/gallery/**
      - tools/gallerysite/**
      - justfile
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# A single Pages deployment at a time; let an in-flight deploy finish rather
# than cancel it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install tools
        run: |
          sudo snap install astral-uv --classic
          sudo snap install just --classic
          echo "/snap/bin" >> "$GITHUB_PATH"

      - name: Build the site
        run: just site-build

      - name: Upload the site
        uses: actions/upload-pages-artifact@v3
        with:
          path: website/site

  deploy:
    name: deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
