# cos-s3.yaml — example preset file for `atelier module add --preset`.
#
# A standalone preset file is a flat map of module variable name → value. Pass
# it to `atelier module add` to configure the freshly added module
# non-interactively and skip the TUI:
#
#   atelier module add https://github.com/canonical/loki-operators.git \
#     --module terraform \
#     --preset docs/examples/cos-s3.yaml \
#     --yes < /dev/null
#
# The wrapper's main.tf is written with these values, ready for:
#
#   terraform init
#   terraform apply -auto-approve
#
# Notes
#   - `--preset` also accepts a named preset from a walk-up atelier.local.yaml
#     (e.g. `--preset cos-s3`), and the atelier.local.yaml schema itself
#     (a top-level `modules:` list) when you need descriptions or several
#     presets in one file.
#   - Values are converted to each variable's declared Terraform type; names
#     the module does not declare are silently dropped.
#   - `model_uuid` is required by loki-operators and is model-specific, so a
#     checked-in example cannot carry a live value. Replace the placeholder
#     below with the UUID of the model you created, e.g.
#     `juju show-model <model> --format json | jq -r '.model-uuid'`.
#     The integration test generates this file at runtime for exactly that
#     reason.
#   - `s3_endpoint` is the address of the S3 backend (e.g. the seaweedfs-k8s
#     unit address at port 8333). That is model-specific too, so it is also
#     filled in at runtime. seaweedfs-k8s needs no auth, so the credentials
#     are placeholders.

channel: dev/edge
model_uuid: 00000000-0000-0000-0000-000000000000
s3_access_key: placeholder
s3_secret_key: placeholder
s3_endpoint: http://10.1.0.95:8333
