juju:
  extra-bootstrap-args: --config bootstrap-timeout=1800 --config model-logs-size=10G
  model-defaults:
    logging-config: <root>=INFO; unit=DEBUG

providers:
  k8s:
    enable: true
    bootstrap: true
    channel: 1.32-classic/stable
    features:
      local-storage: {}
      # Traefik sets no external_hostname, so it needs a real external IP from
      # MetalLB. One address suffices and the range is never routed on the wire.
      load-balancer:
        l2-mode: "true"
        cidrs: "10.43.45.0/28"
